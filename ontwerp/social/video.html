<!doctype html>
<!-- Beeld voor de video's van scripts/social-videos.mjs (540x960 CSS-pixels, op 2x opgenomen: 1080x1920).
     vul() zet de affiches erin, zet(t) tekent het beeld op tijdstip t (in seconden). -->
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/style.css">
<style>
  /* Zwarte achtergrond; --paper is ook de kleur van de inkepingen in de kaartjes. */
  :root { --paper: #121212; }
  html, body { width: 540px; height: 960px; margin: 0; overflow: hidden; background: #121212; color: #fff; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .kop { position: absolute; left: 0; right: 0; top: 44px; text-align: center; }
  .kop .logo { display: inline-flex; align-items: center; gap: 8px; }
  .kop .logo svg:not(.woord) { width: 34px; height: 34px; display: block; }
  .wordmark { font-size: 1.6rem; color: #fff; }
  .wordmark .tld { color: var(--riso-lilac); font-size: .95rem; }
  .kop h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 3.1rem; line-height: .9; letter-spacing: .005em; margin-top: 10px; }
  .rij { position: absolute; left: 0; right: 0; top: 210px; height: 520px; }
  /* Kaartjes van de homepage (300x520), iets groter en om het midden gedraaid. */
  .rij .poster { position: absolute; left: 50%; top: 0; width: 300px; height: 520px; margin-left: -150px; transform-origin: 50% 50%; }
  .credit { position: absolute; left: 40px; right: 40px; top: 798px; text-align: center; font-size: .78rem; line-height: 1.35; color: #fff; opacity: .85; }
  .slot { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: #121212; text-align: center; }
  .slot .merk svg { width: 150px; height: 150px; display: block; }
  .slot .wordmark { font-size: 4.6rem; }
  .slot .wordmark .tld { font-size: 1.6rem; }
  .slot .ondertitel { color: #fff; font-size: .8rem; margin-top: 10px; }
  .slot .oproep { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 2.2rem; line-height: 1; margin-top: 16px; }
  .slot .oproep span { color: var(--riso-yellow); }
  .slot .dank { position: absolute; left: 40px; right: 40px; bottom: 210px; font-size: .8rem; opacity: .85; }
</style>
</head>
<body>
  <div class="kop">
    <span class="logo"><span class="merk"></span><span class="wordmark"><span class="woord"></span><span class="tld">.com</span></span></span>
    <h1>Nu in het theater</h1>
  </div>
  <div class="rij"></div>
  <p class="credit"></p>
  <div class="slot">
    <span class="merk"></span>
    <span class="logo-tekst"><span class="wordmark"><span class="woord"></span><span class="tld">.com</span></span><span class="ondertitel">De theateragenda</span></span>
    <p class="oproep">Alle speeldata op<br><span>cabaretiers.com</span></p>
    <p class="dank"></p>
  </div>
<script>
  const SCHAAL = 1.2, AFSTAND = 300 * SCHAAL + 24;
  const $ = (s) => document.querySelector(s);
  let affiches = [], credits = [];
  const tekst = (s) => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

  window.vul = (video, merk, woord) => {
    document.querySelectorAll(".merk").forEach((el) => (el.innerHTML = merk));
    document.querySelectorAll(".woord").forEach((el) => (el.outerHTML = woord));
    $(".rij").innerHTML = video.affiches.map((a) => a.html).join("");
    affiches = [...document.querySelectorAll(".rij .poster")];
    credits = video.affiches.map((a) => `Foto: ${tekst(a.maker)}, met toestemming van ${tekst(video.van)}`);
    $(".dank").textContent = `Beeld met dank aan ${video.van}`;
  };

  const zacht = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

  // Plek in de rij op tijdstip t: 0 is het eerste kaartje in het midden, 1 het tweede, enzovoort.
  // De rij schuift telkens in SCHUIF seconden door en blijft dan stilstaan.
  window.zet = (t, { INTRO, PER, SCHUIF }) => {
    const n = affiches.length;
    let p;
    if (t < INTRO) p = -1.3 * (1 - zacht(t / INTRO));
    else {
      const k = Math.floor((t - INTRO) / PER), binnen = t - INTRO - k * PER;
      p = Math.min(n, k + zacht((binnen - (PER - SCHUIF)) / SCHUIF));
    }
    affiches.forEach((el, i) => {
      const d = i - p, a = Math.min(1, Math.abs(d));
      el.style.transform = `translateX(${d * AFSTAND}px) scale(${SCHAAL * (1 - 0.12 * a)})`;
      el.style.filter = `brightness(${1 - 0.45 * a})`;
      el.style.zIndex = String(10 - Math.round(Math.abs(d)));
      // Langzaam inzoomen op de foto terwijl het kaartje in het midden staat.
      const img = el.querySelector("img");
      const bezig = t - INTRO - i * PER;
      img.style.transform = `scale(${1 + 0.05 * zacht(bezig / PER)})`;
    });
    const dichtst = Math.round(p);
    const credit = $(".credit");
    credit.innerHTML = credits[Math.max(0, Math.min(n - 1, dichtst))] || "";
    credit.style.opacity = String(0.85 * Math.max(0, 1 - 2.5 * Math.abs(p - dichtst)) * (dichtst >= 0 && dichtst < n ? 1 : 0));
    $(".kop").style.opacity = String(zacht(t / 0.5));
    const slotBegin = INTRO + n * PER - SCHUIF * 0.5;
    $(".slot").style.opacity = String(zacht((t - slotBegin) / 0.5));
  };
</script>
</body>
</html>
