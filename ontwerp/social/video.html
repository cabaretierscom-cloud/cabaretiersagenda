<!doctype html>
<!-- Beeld voor de video's van scripts/social-videos.mjs (720x1280 CSS-pixels, op 1,5x opgenomen: 1080x1920).
     vul() zet de affiches erin, zet(t) tekent het beeld op tijdstip t (in seconden). -->
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/style.css">
<style>
  /* Zwarte achtergrond; --paper is ook de kleur van de inkepingen in de kaartjes. */
  :root { --paper: #121212; }
  html, body { width: 720px; height: 1280px; margin: 0; overflow: hidden; background: #121212; color: #fff; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  /* Woordmerk op zwart, zoals in de footer. */
  .wordmark { color: #fff; }
  .wordmark .tld { color: var(--riso-lilac); }
  .woord .bk-1, .woord .bk-4 { fill: var(--riso-purple); }
  .woord .bk-2, .woord .bk-5 { fill: var(--riso-green); }
  .woord .bk-3, .woord .kern { fill: var(--riso-blue); }
  .kop { position: absolute; left: 0; right: 0; top: 30px; text-align: center; }
  .kop .logo { display: inline-flex; align-items: center; gap: 10px; }
  .kop .logo svg:not(.woord) { width: 40px; height: 40px; display: block; }
  .kop .wordmark { font-size: 2rem; }
  .kop .wordmark .tld { font-size: 1.15rem; }
  .kop h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 3.4rem; line-height: .9; letter-spacing: .005em; margin-top: 8px; }
  /* De affiches staan als een carrousel in de ruimte: de middelste vooraan, de buren gedraaid erachter. */
  .rij { position: absolute; left: 0; right: 0; top: 156px; bottom: 0; perspective: 1500px; perspective-origin: 50% 40%; }
  .rij .poster {
    position: absolute; left: 50%; top: 0; width: 300px; height: 540px; margin-left: -150px; transform-origin: 50% 0;
    --naad: 50%; backface-visibility: hidden;
  }
  /* Maten van de affiche op de computer, ook al is dit beeld smal. */
  .rij .poster-info { padding: 18px 12px 18px 20px; }
  .rij .poster-foto .ftitel { font-size: 2.5rem; margin-top: 0; }
  .rij .poster-foto .ftitel.long { font-size: 2.1rem; }
  .rij .poster-foto .ftitel.xlong { font-size: 1.4rem; }
  .rij .poster-foto .fartiest { font-size: 1.15rem; }
  .rij .poster-foto .tag { font-size: .78rem; padding: 2px 9px; }
  .rij .poster-sterren { font-size: 1.15rem; }
  .poster-citaat { display: block; margin: 12px 0 0; font-size: .9rem; line-height: 1.3; font-weight: 600; font-style: italic; text-wrap: pretty; }
  .poster-citaat:has(+ .tag) { margin-bottom: 14px; }
  .poster-citaat small { display: block; margin-top: 5px; font-size: .74rem; font-style: normal; font-weight: 700; letter-spacing: .02em; }
  .slot { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; background: #121212; text-align: center; }
  .slot .merk svg { width: 200px; height: 200px; display: block; }
  .slot .wordmark { font-size: 6.1rem; }
  .slot .wordmark .tld { font-size: 2.1rem; }
  .slot .ondertitel { color: #fff; font-size: 1.05rem; margin-top: 14px; }
  .slot .oproep { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 2.9rem; line-height: 1; margin-top: 20px; }
  .slot .oproep span { color: var(--riso-yellow); }
</style>
</head>
<body>
  <div class="kop">
    <span class="logo"><span class="merk"></span><span class="wordmark"><span class="woord"></span><span class="tld">.com</span></span></span>
    <h1>Nu in het theater</h1>
  </div>
  <div class="rij"></div>
  <div class="slot">
    <span class="merk"></span>
    <span class="logo-tekst"><span class="wordmark"><span class="woord"></span><span class="tld">.com</span></span><span class="ondertitel">De theateragenda</span></span>
    <p class="oproep">Alle speeldata op<br><span>cabaretiers.com</span></p>
  </div>
<script>
  // Hoe groot de middelste affiche is, hoe ver de buren opzij staan, hoe ver ze naar achteren gaan en hoe schuin.
  const SCHAAL = 2.07, OPZIJ = 470, ACHTER = 520, DRAAI = 48;
  const $ = (s) => document.querySelector(s);
  let affiches = [];

  window.vul = (video, merk, woord) => {
    document.querySelectorAll(".merk").forEach((el) => (el.innerHTML = merk));
    document.querySelectorAll(".woord").forEach((el) => (el.outerHTML = woord));
    $(".rij").innerHTML = video.affiches.map((a) => a.html).join("");
    affiches = [...document.querySelectorAll(".rij .poster")];
  };

  const zacht = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
  // Doorschieten en terugveren, zodat de nieuwe affiche naar voren rolt en even nadeint.
  const veer = (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.4, y = x - 1; return 1 + (c + 1) * y ** 3 + c * y ** 2; };

  // Plek in de rij op tijdstip t: 0 is het eerste kaartje vooraan, 1 het tweede, enzovoort.
  // De rij draait telkens in SCHUIF seconden door en blijft dan staan.
  window.zet = (t, { INTRO, PER, SCHUIF }) => {
    const n = affiches.length;
    let p;
    if (t < INTRO) p = -1.6 * (1 - veer(t / INTRO));
    else {
      const k = Math.floor((t - INTRO) / PER), binnen = t - INTRO - k * PER;
      p = Math.min(n, k + veer((binnen - (PER - SCHUIF)) / SCHUIF));
    }
    affiches.forEach((el, i) => {
      const d = i - p, a = Math.min(1.6, Math.abs(d)), r = Math.max(-1, Math.min(1, d));
      el.style.transform = `translateX(${d * OPZIJ}px) translateZ(${-a * ACHTER}px) rotateY(${-r * DRAAI}deg) scale(${SCHAAL})`;
      el.style.filter = `brightness(${1 - 0.5 * Math.min(1, a)})`;
      el.style.zIndex = String(10 - Math.round(Math.abs(d)));
      el.style.visibility = Math.abs(d) > 2.2 ? "hidden" : "visible";
      // Langzaam inzoomen op de foto terwijl het kaartje vooraan staat.
      el.querySelector("img").style.transform = `scale(${1 + 0.06 * zacht((t - INTRO - i * PER) / PER)})`;
    });
    $(".kop").style.opacity = String(zacht(t / 0.5));
    $(".slot").style.opacity = String(zacht((t - (INTRO + n * PER - SCHUIF * 0.5)) / 0.5));
  };
</script>
</body>
</html>
