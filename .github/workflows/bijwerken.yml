# Elke nacht: speellijsten ophalen, samenvoegen, opslaan en de site op Cloud86 zetten.
# Bij elke wijziging op main: alleen bouwen en de site op Cloud86 zetten.
# Nodig in Settings > Secrets and variables > Actions: CLOUD86_HOST, CLOUD86_USER, CLOUD86_PASSWORD.
# Voor /dashboard/ ook GA_SERVICE_ACCOUNT_B64 (de sleutel van het serviceaccount claude-lezer, in base64).
name: Agenda bijwerken

on:
  schedule:
    - cron: "17 3 * * *" # elke nacht om 03:17 UTC
  workflow_dispatch: {} # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agenda-bijwerken
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Speellijsten ophalen
        if: github.event_name != 'push'
        # Een bron die faalt, houdt zijn vorige uitkomst; de rest gaat gewoon door.
        run: npm run ophalen || echo "::warning::Niet alle bronnen zijn gelukt, zie het logboek hierboven."

      - name: Samenvoegen
        if: github.event_name != 'push'
        run: npm run samenvoegen

      # De cijfers van de vorige run (in de cache van GitHub Actions, niet in de openbare repository). Lukt ophalen
      # niet (Google gaf in november 2026 een middag lang 502-fouten), dan toont /dashboard/ de vorige cijfers.
      - name: Vorige dashboardcijfers terugzetten
        id: vorige-cijfers
        uses: actions/cache/restore@v4
        with:
          path: data/ga-dashboard.json
          key: ga-dashboard-${{ github.run_id }}
          restore-keys: ga-dashboard-

      - name: Cijfers voor het dashboard ophalen
        # 's Nachts verse cijfers; bij een push de vorige uit de cache (alleen ophalen als die er niet is).
        # Het bestand gaat niet in de repository (openbaar), alleen naar de site.
        id: cijfers
        if: github.event_name != 'push' || steps.vorige-cijfers.outputs.cache-matched-key == ''
        env:
          GA_SERVICE_ACCOUNT_B64: ${{ secrets.GA_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -z "$GA_SERVICE_ACCOUNT_B64" ]; then
            echo "::warning::Geen GA_SERVICE_ACCOUNT_B64 ingesteld; /dashboard/ toont geen cijfers."
            exit 0
          fi
          if npm run ga -- dashboard; then
            echo "gelukt=ja" >> "$GITHUB_OUTPUT"
          elif [ -f data/ga-dashboard.json ]; then
            echo "::warning::Google Analytics-cijfers ophalen mislukt; /dashboard/ toont de cijfers van de vorige run."
          else
            echo "::warning::Google Analytics-cijfers ophalen mislukt; /dashboard/ toont geen cijfers."
          fi

      - name: Dashboardcijfers bewaren voor de volgende run
        if: steps.cijfers.outputs.gelukt == 'ja'
        uses: actions/cache/save@v4
        with:
          path: data/ga-dashboard.json
          key: ga-dashboard-${{ github.run_id }}

      - name: Controleren en bouwen
        run: |
          npm run check
          npm run build

      - name: Wijzigingen opslaan
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data; then
            echo "Geen wijzigingen in de agenda."
            exit 0
          fi
          git config user.name "cabaretiers-bot"
          git config user.email "cabaretiers-bot@users.noreply.github.com"
          git add data
          git commit -m "Agenda bijgewerkt $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Site op Cloud86 zetten
        env:
          HOST: ${{ secrets.CLOUD86_HOST }}
          GEBRUIKER: ${{ secrets.CLOUD86_USER }}
          LFTP_PASSWORD: ${{ secrets.CLOUD86_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$GEBRUIKER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Geen Cloud86-gegevens ingesteld; de site is niet geplaatst."
            exit 0
          fi
          # lftp installeren. security.ubuntu.com, waar apt lftp haalt, was in november 2026 een middag lang onbereikbaar
          # vanaf GitHub. Lukt het niet binnen twee minuten, dan plaatst scripts/sftp-plaatsen.py de site (Python met
          # paramiko van PyPI; dezelfde controle vooraf, alleen gewijzigde bestanden, oude bestanden weg).
          if ! timeout 120 sudo apt-get install -y -qq lftp > /dev/null 2>&1; then
            echo "lftp niet te installeren; de site gaat via scripts/sftp-plaatsen.py."
            python3 -m pip install --quiet paramiko
            python3 scripts/sftp-plaatsen.py
            exit $?
          fi
          lftp --version | head -1
          verbind="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open --env-password -u $GEBRUIKER sftp://$HOST"
          # Op dit hostingpakket heeft elk domein een eigen map; die van www.cabaretiers.com is cabaretiers.com/.
          DOEL=cabaretiers.com
          # 1. Veiligheidscontrole: testbestand neerzetten en kijken of www.cabaretiers.com het toont.
          #    Zo niet, dan is $DOEL niet de map van de website en wordt er niets verplaatst, geplaatst of gewist.
          test="plaatsingstest-${GITHUB_RUN_ID}.txt"
          echo "$GITHUB_RUN_ID" > "$test"
          lftp -c "$verbind; put $test -o $DOEL/$test"
          # Tot een halve minuut wachten: soms is een nieuw bestand niet meteen zichtbaar.
          gevonden=""
          for poging in 1 2 3 4 5 6; do
            sleep 5
            gevonden=$(curl -s "https://www.cabaretiers.com/$test?$RANDOM" || true)
            [ "$gevonden" = "$GITHUB_RUN_ID" ] && break
          done
          lftp -c "$verbind; rm $DOEL/$test" || true
          if [ "$gevonden" != "$GITHUB_RUN_ID" ]; then
            echo "::error::$DOEL is niet de map van www.cabaretiers.com: het testbestand is daar niet te zien. Er is niets geplaatst."
            exit 1
          fi
          # 2. Eenmalig: staat er WordPress, verplaats dan alles (ook mappen) naar wordpress-oud-cabaretiers.
          #    .well-known (SSL-certificaat van Let's Encrypt) blijft staan.
          if lftp -c "$verbind; cls $DOEL/wp-config.php" > /dev/null 2>&1; then
            echo "WordPress gevonden in $DOEL; wordt verplaatst naar wordpress-oud-cabaretiers."
            lftp -c "$verbind; mkdir -p wordpress-oud-cabaretiers"
            lftp -c "$verbind; cls -1a $DOEL/" | sed "s#^$DOEL/##; s#/\$##" | grep -vxE '\.|\.\.|\.well-known|' | while read -r x; do
              lftp -c "$verbind; mv \"$DOEL/$x\" \"wordpress-oud-cabaretiers/$x\""
            done
            if lftp -c "$verbind; cls $DOEL/wp-config.php" > /dev/null 2>&1; then
              echo "::error::WordPress kon niet volledig worden verplaatst; er is niets geplaatst."
              exit 1
            fi
          fi
          # 3. dist/ naar $DOEL/. Wat niet meer in dist staat, verdwijnt; .well-known blijft staan.
          lftp -c "$verbind; mirror --reverse --delete --parallel=8 --verbose=1 --exclude-glob .well-known/ dist/ $DOEL/"
